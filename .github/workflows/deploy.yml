name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx vite build
        env:
          VITE_RODEO_SUPABASE_URL: ${{ secrets.VITE_RODEO_SUPABASE_URL }}
          VITE_RODEO_SUPABASE_ANON_KEY: ${{ secrets.VITE_RODEO_SUPABASE_ANON_KEY }}
          VITE_RODEO_TURNSTILE_SITE_KEY: ${{ secrets.VITE_RODEO_TURNSTILE_SITE_KEY }}
          VITE_BIGCHILL_SUPABASE_URL: ${{ secrets.VITE_BIGCHILL_SUPABASE_URL }}
          VITE_BIGCHILL_SUPABASE_ANON_KEY: ${{ secrets.VITE_BIGCHILL_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment